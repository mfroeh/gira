name: Rust

on:
  pull_request:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: cargo build --verbose

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: cargo clippy --verbose

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: cargo test --verbose
